name: Verify SQL Query Agent
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sql-agent/frontend/package-lock.json
      - working-directory: sql-agent/backend
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -v test_agent
      - working-directory: sql-agent/frontend
        run: |
          npm ci
          npm test
          npm run build
          node --test test/browser.test.js
      - run: docker build -t sql-query-agent .
      - name: Check the packaged application
        run: |
          export WORKSPACE_USER=ci WORKSPACE_PASSWORD="$(openssl rand -hex 24)" GROQ_API_KEY=test-fixture
          docker run -d --name sql-query-agent -e WORKSPACE_USER -e WORKSPACE_PASSWORD -e GROQ_API_KEY -p 127.0.0.1:8090:8000 sql-query-agent
          if ! (
            curl --fail --retry 15 --retry-delay 1 --retry-all-errors http://127.0.0.1:8090/api/health &&
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/api/schema)" = 401 &&
            curl --fail -u "$WORKSPACE_USER:$WORKSPACE_PASSWORD" http://127.0.0.1:8090/api/schema &&
            curl --fail -u "$WORKSPACE_USER:$WORKSPACE_PASSWORD" http://127.0.0.1:8090/ | grep 'SQL Query Agent'
          ); then
            docker logs sql-query-agent || true
            exit 1
          fi
